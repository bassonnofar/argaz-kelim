<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>דיווח הוצאות – ארגז כלים</title>
<meta name="theme-color" content="#2C5F2D">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--cream:#FBF6EC;--paper:#FFFDF8;--forest:#2C5F2D;--mint:#CFE6D2;--ink:#2A3328;--muted:#6B7466;--line:#E6DCC8;--rose:#C2577A;--err:#c62828;--ok:#2e7d32}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:"Rubik",system-ui,sans-serif;color:var(--ink);background:var(--cream);font-size:16px;
  padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 24px)}
.wrap{max-width:520px;margin:0 auto;padding:0 16px}
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 0 6px}
.back{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-weight:600;font-size:15px;
  color:var(--forest);background:var(--mint);border-radius:999px;padding:8px 14px}
.back svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
h1{font-size:23px;margin:14px 0 2px;color:var(--forest)}
.sub{margin:0 0 16px;color:var(--muted);font-size:14.5px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:18px 18px 20px}
label{display:block;font-weight:600;margin:14px 0 6px;font-size:15px}
label:first-child{margin-top:0}
.req{color:var(--err)}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;font:inherit;background:#fff;color:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid var(--forest);border-color:transparent}
textarea{min-height:80px;resize:vertical}
.row{display:flex;gap:12px}.row>div{flex:1;min-width:0}
.amount{position:relative}.amount span{position:absolute;left:12px;top:12px;color:var(--muted)}
.file{display:block;border:2px dashed var(--line);border-radius:14px;padding:18px;text-align:center;cursor:pointer;color:var(--muted);font-weight:500}
.file.has{border-color:var(--ok);color:var(--ok);border-style:solid}
.file input{display:none}
.file img{max-width:100%;max-height:180px;border-radius:10px;margin:10px auto 0;display:block}
button{width:100%;margin-top:20px;padding:14px;border:0;border-radius:14px;background:var(--forest);color:#fff;font:inherit;font-weight:700;font-size:17px;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.msg{margin-top:14px;padding:12px;border-radius:12px;display:none}
.msg.err{display:block;background:#fdecea;color:var(--err)}
.done{text-align:center}
.done .big{font-size:46px}
.done h2{margin:6px 0;color:var(--forest)}
.budget{margin:16px 0;background:var(--cream);border-radius:14px;padding:14px}
.budget b{font-size:22px}
.budget.neg b{color:var(--err)}
.loading{text-align:center;color:var(--muted);padding:30px 0}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="back" href="./"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>ארגז הכלים</a>
  </div>
  <h1>🏗️ דיווח הוצאות</h1>
  <p class="sub">תחרות בניינים · כל הוצאה מדווחת עם קבלה או חשבונית</p>

  <div class="card" id="formCard">
    <div class="loading" id="loading">טוען…</div>
    <form id="f" novalidate hidden>
      <label for="group">שם הקבוצה <span class="req">*</span></label>
      <select id="group"><option value="">בחירת קבוצה…</option></select>

      <label for="counselor">שם המדריך/ה <span class="req">*</span></label>
      <input id="counselor" autocomplete="name">

      <div class="row">
        <div>
          <label for="amount">סכום <span class="req">*</span></label>
          <div class="amount"><input id="amount" type="number" inputmode="decimal" min="0.01" step="0.01"><span>₪</span></div>
        </div>
        <div>
          <label for="purchaseDate">תאריך הרכישה</label>
          <input id="purchaseDate" type="date">
        </div>
      </div>

      <label for="store">איפה קנית? <span class="req">*</span></label>
      <input id="store" placeholder="למשל: הום סנטר כרמיאל">

      <label for="purpose">מה נקנה / מטרת הקנייה <span class="req">*</span></label>
      <textarea id="purpose" placeholder="למשל: קרטונים ודבק חם לבניית המגדל"></textarea>

      <label>קבלה / חשבונית <span class="req">*</span></label>
      <label class="file" id="fileBox">
        <input id="file" type="file" accept="image/*,application/pdf">
        <span id="fileText">📷 לצלם או לבחור קובץ (תמונה או PDF)</span>
        <img id="preview" alt="" hidden>
      </label>

      <button id="btn" type="submit">שליחת דיווח</button>
    </form>
    <div class="msg" id="msg"></div>
  </div>

  <div class="card done" id="doneCard" hidden>
    <div class="big">✅</div>
    <h2>הדיווח התקבל!</h2>
    <p>הקבלה נשמרה בתיקיית הקבוצה.</p>
    <div class="budget" id="budget"></div>
    <button type="button" id="again">דיווח נוסף</button>
  </div>
</div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbx0CsYz3ACw8fAsVhLfZ4f5Mu7kGNfYgmj0KtvdZUFM8b1UdG9ZAk8rcCFdwKeF6Yb4/exec';
const $ = id => document.getElementById(id);
let GROUPS = [], MAX_MB = 10, picked = null;

function showErr(t){ const m=$('msg'); m.className='msg err'; m.textContent=t; }
function clearErr(){ $('msg').className='msg'; }

function today(){ const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); }

// הקריאות לגוגל נשלחות בלי פרטי חשבון – לכן לא משנה לכמה חשבונות הטלפון מחובר
fetch(API + '?action=groups', { credentials: 'omit' })
  .then(r => r.json())
  .then(d => {
    if (!d.ok) throw new Error();
    GROUPS = d.groups; MAX_MB = d.maxMb || 10;
    GROUPS.forEach(g => { const o=document.createElement('option'); o.value=o.textContent=g; $('group').appendChild(o); });
    try {
      const s = JSON.parse(localStorage.getItem('expenseUser') || '{}');
      if (s.group && GROUPS.includes(s.group)) $('group').value = s.group;
      if (s.counselor) $('counselor').value = s.counselor;
    } catch(e){}
    $('purchaseDate').value = today(); $('purchaseDate').max = today();
    $('loading').hidden = true; $('f').hidden = false;
  })
  .catch(() => { $('loading').hidden = true; showErr('לא הצלחתי לטעון את הטופס. בדקו חיבור לאינטרנט ונסו שוב.'); });

$('file').addEventListener('change', function(){
  picked = this.files[0] || null;
  const box=$('fileBox'), img=$('preview'); img.hidden = true;
  if (!picked){ box.classList.remove('has'); $('fileText').textContent='📷 לצלם או לבחור קובץ (תמונה או PDF)'; return; }
  box.classList.add('has'); $('fileText').textContent = '✔ ' + picked.name;
  if (/^image\//.test(picked.type)){ const r=new FileReader(); r.onload=()=>{ img.src=r.result; img.hidden=false; }; r.readAsDataURL(picked); }
});

function readAsDataURL(file){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file); }); }

// כיווץ תמונות גדולות מהטלפון
function prepareFile(file){
  const isImg = /^image\/(jpeg|png|webp)$/.test(file.type);
  if (!isImg || file.size < 1.2*1024*1024) return readAsDataURL(file).then(u => ({ url:u, type:file.type || 'application/octet-stream' }));
  return readAsDataURL(file).then(u => new Promise(res => {
    const img = new Image();
    img.onload = () => {
      const max=2000, k=Math.min(1, max/Math.max(img.width,img.height));
      const c=document.createElement('canvas'); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      res({ url:c.toDataURL('image/jpeg',0.85), type:'image/jpeg' });
    };
    img.onerror = () => res({ url:u, type:file.type });
    img.src = u;
  }));
}

$('f').addEventListener('submit', e => {
  e.preventDefault(); clearErr();
  const d = {
    group: $('group').value, counselor: $('counselor').value.trim(), amount: $('amount').value,
    purchaseDate: $('purchaseDate').value, store: $('store').value.trim(), purpose: $('purpose').value.trim()
  };
  if (!d.group) return showErr('יש לבחור קבוצה');
  if (!d.counselor) return showErr('יש למלא שם מדריך/ה');
  if (!(Number(d.amount) > 0)) return showErr('יש למלא סכום תקין');
  if (!d.store) return showErr('יש למלא איפה קנית');
  if (!d.purpose) return showErr('יש לכתוב מה נקנה / מטרת הקנייה');
  if (!picked) return showErr('חובה לצרף קבלה או חשבונית');
  if (!(/^image\//.test(picked.type) || picked.type==='application/pdf' || /\.(heic|heif)$/i.test(picked.name))) return showErr('אפשר לצרף רק תמונה או PDF');

  const btn=$('btn'); btn.disabled=true; btn.textContent='שולח…';
  prepareFile(picked).then(f => {
    const b64 = f.url.split(',')[1] || '';
    if (b64.length*0.75 > MAX_MB*1024*1024) throw new Error('הקובץ גדול מדי (מקסימום ' + MAX_MB + 'MB)');
    d.fileData = b64;
    d.mimeType = f.type || (/\.heif$/i.test(picked.name) ? 'image/heif' : 'image/heic');
    d.fileName = picked.name;
    return fetch(API, { method:'POST', credentials:'omit', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(d) });
  }).then(r => r.json()).then(r => {
    if (!r.ok) throw new Error(r.error || 'משהו השתבש, נסו שוב');
    try { localStorage.setItem('expenseUser', JSON.stringify({ group:d.group, counselor:d.counselor })); } catch(e){}
    const b=$('budget');
    b.className = 'budget' + (r.remaining < 0 ? ' neg' : '');
    b.innerHTML = 'יתרה לקבוצה <span id="g"></span>:<br><b>' + r.remaining.toLocaleString('he-IL') + ' ₪</b><br><small>נוצלו ' +
      r.spent.toLocaleString('he-IL') + ' ₪ מתוך ' + r.budget.toLocaleString('he-IL') + ' ₪</small>';
    $('g').textContent = d.group;
    $('formCard').hidden = true; $('doneCard').hidden = false; window.scrollTo(0,0);
  }).catch(err => {
    showErr((err && err.message && !/fetch|JSON/i.test(err.message)) ? err.message : 'השליחה לא הצליחה. בדקו חיבור לאינטרנט ונסו שוב.');
  }).finally(() => { btn.disabled=false; btn.textContent='שליחת דיווח'; });
});

$('again').addEventListener('click', () => {
  ['amount','store','purpose'].forEach(id => $(id).value='');
  $('purchaseDate').value = today();
  $('file').value=''; picked=null; $('file').dispatchEvent(new Event('change'));
  $('doneCard').hidden = true; $('formCard').hidden = false;
});
</script>
</body>
</html>
